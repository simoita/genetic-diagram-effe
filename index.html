<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accesso - Diagramma Cascata</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #1e293b; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,.4); width: 100%; max-width: 380px; text-align: center; }
  h1 { margin-bottom: 1rem; font-size: 1.25rem; color: #60a5fa; }
  p.sub { margin-bottom: 1.5rem; color: #cbd5e1; font-size: .9rem; }
  input { width: 100%; padding: .75rem; margin-bottom: 1rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
  button { width: 100%; padding: .75rem; background: #60a5fa; color: #000; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 1rem; }
  button:hover { background: #3b82f6; }
  .error { color: #f87171; margin-top: .75rem; font-size: .875rem; display: none; }
  .hint { margin-top: 1rem; font-size: .8rem; color: #94a3b8; }
</style>
</head>
<body>
<div class="card">
  <h1>🔒 Diagramma Cascata</h1>
  <p class="sub">Inserisci la password per accedere</p>
  <input type="password" id="pwd" placeholder="Password">
  <button onclick="login()">Accedi</button>
  <div class="error" id="err">Password errata</div>
  <div class="hint">La sessione resta attiva finché non chiudi la scheda del browser</div>
</div>
<script>
const PASSWORD = 'diagramma2026';
function login(){
  const v=document.getElementById('pwd').value;
  const err=document.getElementById('err');
  if(v===PASSWORD){
    sessionStorage.setItem('cascade_auth','1');
    window.location.href='runme.html';
  } else {
    err.style.display='block';
    document.getElementById('pwd').value='';
  }
}
document.getElementById('pwd').addEventListener('keypress',e=>{if(e.key==='Enter')login();});
</script>
</body>
</html>
